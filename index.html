<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manzana Cadastro</title>
    <link rel="stylesheet" href="style.css">
     <link href="https://googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
     <link rel="icon" href="apple-image.png">

</head>
<body>
    
    <div class="cadastro">
        <div class="esquerdo">
            <h2 id="bem-vindo">BEM-VINDO DE VOLTA!</h2>
            <br><br>
            <h4 id="texto">Para continuar conectado com 
                nós, por favor faça seu cadastro
            </h4>
            <br><br>
        

        </div>

        <div class="direito">
            <h2 class="criar">MANZANA</h2>
            <br><br>
            
            <div class="social-login">
                  <div class="google">                  
                        <i class="fa-brands fa-google"></i>
                  </div>

                  <div class="email-icone">
                        <i class="fa-solid fa-envelope"></i>
                  </div>

                  <div class="git">
                      <i class="fa-brands fa-github"></i>
                    </div>
            </div>
            <br><br>

            <div class="preencher">    
                <div class="nome">
                    <input type="text" placeholder="NOME">
                </div>
                <br>
                <div class="email">
                    <input type="email" placeholder="EMAIL">
                </div>
                <br>
                <div class="senha">
                    <input type="password" placeholder="SENHA">
                </div>
            </div>
            <br><br>
            <button><a href="site.html">ENTRAR</a></button>

        </div>
    </div>
</body>
</html>
